<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" font-family="Microsoft YaHei, PingFang SC, Helvetica, sans-serif">
  <rect width="1160" height="660" fill="#f8fafc"/>

  <text x="40" y="62" font-size="30" font-weight="700" fill="#0f172a">CSS 盒子模型（二）：尺寸计算 · 背景 · 渐变</text>
  <text x="40" y="94" font-size="15" fill="#64748b">第 45~48 节 · box-sizing / background 六属性 / 背景复合写法 / 渐变与文字渐变</text>

  <!-- panel A -->
  <rect x="40" y="120" width="520" height="400" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="72" y="162" font-size="20" font-weight="700" fill="#111827">① content-box（默认）</text>
  <text x="72" y="190" font-size="14" fill="#6b7280">width 只算内容区，padding 与 border 额外加上去</text>

  <rect x="135" y="212" width="330" height="206" rx="4" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="150" y="226" width="300" height="178" rx="4" fill="#fff7ed" stroke="#fb923c" stroke-width="6"/>
  <rect x="163" y="239" width="274" height="152" rx="2" fill="#ffedd5"/>
  <rect x="196" y="268" width="208" height="124" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="300" y="336" font-size="15" text-anchor="middle" fill="#0f172a">content 300 × 150</text>

  <circle cx="478" cy="228" r="4" fill="#cbd5e1"/>
  <text x="490" y="233" font-size="12" fill="#94a3b8">margin</text>
  <circle cx="478" cy="262" r="4" fill="#fb923c"/>
  <text x="490" y="267" font-size="12" fill="#c2410c">border 4px</text>
  <circle cx="478" cy="296" r="4" fill="#ffedd5"/>
  <text x="490" y="301" font-size="12" fill="#b45309">padding 20px</text>
  <circle cx="478" cy="330" r="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="490" y="335" font-size="12" fill="#475569">content</text>

  <text x="72" y="418" font-size="17" font-weight="700" fill="#b45309">总宽 = 300 + 20×2 + 4×2 = 348px</text>
  <text x="72" y="446" font-size="13" fill="#6b7280">设计稿标 300，量出来 348 ——「盒子为什么变大」的根</text>
  <text x="72" y="468" font-size="13" fill="#6b7280">width:100% 溢出、三个 33% 换行，都出在这里</text>

  <!-- panel B -->
  <rect x="600" y="120" width="520" height="400" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="632" y="162" font-size="20" font-weight="700" fill="#111827">② border-box（推荐）</text>
  <text x="632" y="190" font-size="14" fill="#6b7280">width 就是总宽，padding 和 border 从里面扣</text>

  <rect x="735" y="212" width="290" height="206" rx="4" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="750" y="226" width="260" height="178" rx="4" fill="#fff7ed" stroke="#fb923c" stroke-width="6"/>
  <rect x="763" y="239" width="234" height="152" rx="2" fill="#ffedd5"/>
  <rect x="800" y="268" width="160" height="124" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="880" y="336" font-size="15" text-anchor="middle" fill="#0f172a">content 252 × 110</text>

  <circle cx="1038" cy="228" r="4" fill="#cbd5e1"/>
  <text x="1050" y="233" font-size="12" fill="#94a3b8">margin</text>
  <circle cx="1038" cy="262" r="4" fill="#fb923c"/>
  <text x="1050" y="267" font-size="12" fill="#c2410c">border 4px</text>
  <circle cx="1038" cy="296" r="4" fill="#ffedd5"/>
  <text x="1050" y="301" font-size="12" fill="#b45309">padding 20px</text>
  <circle cx="1038" cy="330" r="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1050" y="335" font-size="12" fill="#475569">content</text>

  <text x="632" y="418" font-size="17" font-weight="700" fill="#15803d">总宽 = 300（padding / border 内含）</text>
  <text x="632" y="446" font-size="13" fill="#6b7280">内容宽 = 300 − 20×2 − 4×2 = 252px</text>
  <text x="632" y="468" font-size="13" fill="#6b7280">这才符合「我给的是一个 300 的盒子」的直觉</text>

  <!-- gradient strip -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect x="40" y="548" width="1080" height="56" rx="12" fill="url(#g1)"/>
  <text x="64" y="583" font-size="15" fill="#ffffff" font-weight="700">background: linear-gradient(90deg, #f97316, #ec4899, #6366f1) —— 渐变只是 background-image 的一种函数值</text>

  <text x="40" y="636" font-size="12" fill="#94a3b8">示意图非严格等比，具体数字以左侧公式为准 · 2026-11-19 CSS 学习笔记配图</text>
</svg>
